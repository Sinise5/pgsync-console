<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">Local PostgreSQL to OpenSearch demo</title>
  <desc id="desc">The seeded PostgreSQL database contains three customers and four orders. PGSync Console maps customers as the main table and orders as a one-to-many child using customer_id, then writes three customer documents to the local_customers OpenSearch index.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1280" height="610" rx="24" fill="#f5f7fb"/>
  <text x="48" y="59" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#52637a">LOCAL DEMO</text>
  <text x="48" y="101" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#13233a">PostgreSQL → OpenSearch</text>
  <text x="48" y="132" font-family="Arial, sans-serif" font-size="16" fill="#52637a">A seeded example of schema mapping and one batch sync</text>

  <g filter="url(#shadow)">
    <rect x="48" y="174" width="330" height="332" rx="18" fill="#ffffff" stroke="#dbe4ef"/>
    <rect x="48" y="174" width="330" height="9" rx="5" fill="#3978c5"/>
  </g>
  <circle cx="80" cy="220" r="16" fill="#e8f1fc"/>
  <text x="80" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#245fa7">1</text>
  <text x="108" y="226" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172b45">PostgreSQL source</text>
  <text x="76" y="264" font-family="Arial, sans-serif" font-size="14" fill="#65758b">Service</text>
  <text x="350" y="264" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#253850">demo-postgres</text>
  <text x="76" y="293" font-family="Arial, sans-serif" font-size="14" fill="#65758b">Database</text>
  <text x="350" y="293" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#253850">pgsync_demo</text>
  <line x1="76" y1="313" x2="350" y2="313" stroke="#e7edf4"/>
  <rect x="76" y="331" width="274" height="54" rx="10" fill="#f4f8fd"/>
  <text x="92" y="354" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#253850">customers</text>
  <text x="334" y="354" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#52637a">3 rows · main table</text>
  <text x="92" y="374" font-family="Arial, sans-serif" font-size="12" fill="#52637a">id · name · email</text>
  <rect x="76" y="396" width="274" height="54" rx="10" fill="#f4f8fd"/>
  <text x="92" y="419" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#253850">orders</text>
  <text x="334" y="419" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#52637a">4 rows · child table</text>
  <text x="92" y="439" font-family="Arial, sans-serif" font-size="12" fill="#52637a">customer_id → customers.id</text>
  <text x="76" y="478" font-family="Arial, sans-serif" font-size="12" fill="#65758b">Host port: 55432</text>

  <line x1="398" y1="339" x2="444" y2="339" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="468" y="174" width="344" height="332" rx="18" fill="#ffffff" stroke="#dbe4ef"/>
    <rect x="468" y="174" width="344" height="9" rx="5" fill="#7b61a8"/>
  </g>
  <circle cx="500" cy="220" r="16" fill="#f0ebf7"/>
  <text x="500" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#684a97">2</text>
  <text x="528" y="226" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172b45">PGSync Console</text>
  <text x="496" y="265" font-family="Arial, sans-serif" font-size="14" fill="#52637a">Configure connections</text>
  <rect x="496" y="280" width="288" height="40" rx="9" fill="#f7f5fa"/>
  <circle cx="515" cy="300" r="5" fill="#3d9b71"/>
  <text x="531" y="305" font-family="Arial, sans-serif" font-size="13" fill="#253850">Test PostgreSQL and OpenSearch</text>
  <text x="496" y="351" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#253850">Schema Builder mapping</text>
  <rect x="496" y="367" width="126" height="40" rx="9" fill="#edf3fb"/>
  <text x="559" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#245fa7">customers</text>
  <text x="640" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">1:N</text>
  <rect x="658" y="367" width="126" height="40" rx="9" fill="#f4eff8"/>
  <text x="721" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#684a97">orders</text>
  <text x="496" y="435" font-family="Arial, sans-serif" font-size="13" fill="#52637a">Join: orders.customer_id = customers.id</text>
  <rect x="496" y="454" width="132" height="32" rx="8" fill="#eaf5ef"/>
  <text x="562" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#287650">Batch sync</text>
  <text x="646" y="475" font-family="Arial, sans-serif" font-size="12" fill="#65758b">sample config</text>

  <line x1="832" y1="339" x2="878" y2="339" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="902" y="174" width="330" height="332" rx="18" fill="#ffffff" stroke="#dbe4ef"/>
    <rect x="902" y="174" width="330" height="9" rx="5" fill="#d58b34"/>
  </g>
  <circle cx="934" cy="220" r="16" fill="#fbf1e4"/>
  <text x="934" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a96719">3</text>
  <text x="962" y="226" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172b45">OpenSearch target</text>
  <text x="930" y="264" font-family="Arial, sans-serif" font-size="14" fill="#65758b">Index</text>
  <text x="1204" y="264" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#253850">local_customers</text>
  <line x1="930" y1="285" x2="1204" y2="285" stroke="#e7edf4"/>
  <text x="930" y="314" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#52637a">Example indexed document</text>
  <rect x="930" y="330" width="274" height="142" rx="10" fill="#f7f8fa"/>
  <text x="948" y="356" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">{</text>
  <text x="966" y="378" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">"name": "Ayu Lestari",</text>
  <text x="966" y="400" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">"orders": [</text>
  <text x="984" y="422" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">"DEMO-1001", "DEMO-1002"</text>
  <text x="966" y="444" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">]</text>
  <text x="948" y="462" font-family="Menlo, Consolas, monospace" font-size="12" fill="#475569">}</text>
  <text x="930" y="490" font-family="Arial, sans-serif" font-size="12" fill="#65758b">3 customer documents · host port 19200</text>

  <text x="48" y="564" font-family="Arial, sans-serif" font-size="13" fill="#65758b">Sample data comes from pgsync-admin/demo/local-postgres-seed.sql</text>
  <text x="1232" y="564" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#52637a">Admin UI: localhost:3507</text>
</svg>
