[project]
name = "pgsync-admin-backend"
version = "0.6.0"
description = "PGSync Admin - Backend API (Robyn)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "robyn>=0.84.0",
    "sqlalchemy>=2.0.0",
    "psycopg>=3.2.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "clickhouse-driver>=0.2.7",
    "psutil>=5.9.0",
    "apscheduler>=3.10.0",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "opensearch-py>=3.0.0",
    "pgsync==7.3.0",
    "pgsync-clickhouse==0.1.0",
    "PyMySQL>=1.1.0",
    "psycopg2-binary==2.9.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.1.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "watchfiles>=0.21.0",
    "alembic>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
